name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-22.04
    permissions:
      checks: read
    steps:
      - name: Verify CI passed on tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REQUIRED=("Build Check" "Test and Coverage" "Security Audit" "Spell Check (typos)" "E2E Smoke Tests")
          TIMEOUT=1800
          POLL_INTERVAL=30
          DEADLINE=$(( $(date +%s) + TIMEOUT ))

          echo "Checking CI status for commit ${SHA} in ${REPO}..."

          while true; do
            RESULT=$(gh api "repos/${REPO}/commits/${SHA}/check-runs?filter=latest&per_page=100")

            ALL_PASS=true
            PENDING=()

            for CHECK in "${REQUIRED[@]}"; do
              # Distinguish absent (not yet queued), pending (null conclusion = in-progress),
              # and a real conclusion so we don't fail-fast on a check that hasn't started.
              STATUS=$(echo "$RESULT" | jq -r --arg name "$CHECK" \
                'if ([.check_runs[] | select(.name == $name)] | length) == 0
                 then "absent"
                 else ([.check_runs[] | select(.name == $name)] | last | .conclusion // "pending")
                 end')
              case "$STATUS" in
                success)
                  echo "PASS: ${CHECK}" ;;
                pending|absent)
                  echo "WAIT: ${CHECK} — ${STATUS}"
                  PENDING+=("$CHECK") ;;
                *)
                  echo "FAIL: ${CHECK} — conclusion=${STATUS}"
                  ALL_PASS=false ;;
              esac
            done

            # A check already failed — no point waiting for the rest.
            if [[ "$ALL_PASS" == "false" ]]; then
              break
            fi

            # All required checks have a final conclusion.
            if [[ ${#PENDING[@]} -eq 0 ]]; then
              break
            fi

            if (( $(date +%s) >= DEADLINE )); then
              echo "Timeout: checks still pending/absent after ${TIMEOUT}s: ${PENDING[*]}"
              exit 1
            fi

            echo "Waiting ${POLL_INTERVAL}s for ${#PENDING[@]} check(s): ${PENDING[*]}..."
            sleep "$POLL_INTERVAL"
          done

          if [[ "$ALL_PASS" != "true" ]]; then
            echo ""
            echo "Release blocked: required CI checks did not all pass on ${SHA}."
            echo "Fix the failing checks and re-tag from a green commit."
            exit 1
          fi

          echo "All required checks passed. Proceeding with release."

  release-linux:
    name: Build and Release (Linux)
    runs-on: ubuntu-22.04
    needs: ci-gate

    steps:
      # ------------------------------------------------------------------ #
      # 1. Checkout — full history so changelog generation works correctly  #
      # ------------------------------------------------------------------ #
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ------------------------------------------------------------------ #
      # 1b. Version consistency preflight                                   #
      # ------------------------------------------------------------------ #
      - name: Verify version consistency
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r '.version' package.json)
          CARGO_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CHANGELOG_MATCH=$(grep "^## \[${TAG}\]" CHANGELOG.md || echo "")
          FAIL=0
          [ "$PKG_VERSION"   != "$TAG" ] && echo "ERROR: package.json version (${PKG_VERSION}) != tag (${TAG})"       && FAIL=1
          [ "$CARGO_VERSION" != "$TAG" ] && echo "ERROR: Cargo.toml version (${CARGO_VERSION}) != tag (${TAG})"       && FAIL=1
          [ "$TAURI_VERSION" != "$TAG" ] && echo "ERROR: tauri.conf.json version (${TAURI_VERSION}) != tag (${TAG})"  && FAIL=1
          [ -z "$CHANGELOG_MATCH"      ] && echo "ERROR: CHANGELOG.md has no entry for [${TAG}]"                      && FAIL=1
          [ $FAIL -eq 0 ] && echo "All version sources match tag ${TAG}."
          exit $FAIL

      # ------------------------------------------------------------------ #
      # 2. Rust stable with Swatinem cache                                  #
      # ------------------------------------------------------------------ #
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067  # stable (2025-04)
        with:
          toolchain: stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      # ------------------------------------------------------------------ #
      # 3. pnpm + Node.js 20                                                #
      # ------------------------------------------------------------------ #
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No 'version' key — reads from package.json "packageManager" field

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      # ------------------------------------------------------------------ #
      # 4. Frontend dependencies                                            #
      # ------------------------------------------------------------------ #
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------ #
      # 5. Tauri v2 Linux system dependencies (Ubuntu 22.04)               #
      # ------------------------------------------------------------------ #
      - name: Install Tauri Linux system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            pkg-config \
            squashfs-tools

      # ------------------------------------------------------------------ #
      # 5b. Pre-seed Tauri's AppRun with a world-executable mode            #
      # ------------------------------------------------------------------ #
      # tauri-bundler downloads AppRun into ~/.cache/tauri with mode 0770 and
      # fs::copy()s it into the AppDir, where linuxdeploy renames it to
      # AppRun.wrapped. Root-owned and 0770 in the squashfs, it cannot be run
      # by any other user (AppImageHub's test fails with "Permission denied").
      # The bundler only downloads AppRun when the cached file is missing, so
      # seeding it here with 0755 fixes the packaged mode. Same upstream asset
      # the bundler fetches, pinned by checksum.
      - name: Pre-seed Tauri AppRun (0755)
        env:
          APPRUN_SHA256: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-${HOME}/.cache}/tauri"
          mkdir -p "${TOOLS}"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${TOOLS}/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          echo "${APPRUN_SHA256}  ${TOOLS}/AppRun-x86_64" | sha256sum -c -
          chmod 0755 "${TOOLS}/AppRun-x86_64"

      # ------------------------------------------------------------------ #
      # 6. Build distributable bundles                                      #
      # ------------------------------------------------------------------ #
      - name: Build Tauri application
        run: pnpm tauri build
        env:
          CI: true

      # ------------------------------------------------------------------ #
      # 7. Binary size budget check                                         #
      # ------------------------------------------------------------------ #
      - name: Run binary size budget check
        run: bash scripts/profile.sh --no-launch

      # ------------------------------------------------------------------ #
      # 8. Locate built artifacts and compute checksums                     #
      # ------------------------------------------------------------------ #
      - name: Locate artifacts
        id: artifacts
        run: |
          set -euo pipefail
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name "*.AppImage" ! -name "*.sig" | head -n1)
          DEB=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n1)
          echo "appimage=${APPIMAGE}" >> "$GITHUB_OUTPUT"
          echo "deb=${DEB}" >> "$GITHUB_OUTPUT"
          echo "Found AppImage: ${APPIMAGE}"
          echo "Found deb:      ${DEB}"

      - name: Verify AppImage file permissions
        run: |
          set -euo pipefail
          APPIMAGE="$(realpath "${{ steps.artifacts.outputs.appimage }}")"
          OFFSET="$("${APPIMAGE}" --appimage-offset)"
          # Read modes from the squashfs itself: --appimage-extract run as root
          # does not reproduce directory modes faithfully. Everything must be
          # readable by all users, directories traversable, and anything
          # executable by its owner executable by all users too.
          BAD="$(unsquashfs -o "${OFFSET}" -lln "${APPIMAGE}" | awk '
            $1 ~ /^d/ && substr($1, 8, 3) !~ /^r.x$/ { print; next }
            $1 ~ /^-/ && (substr($1, 8, 1) != "r" ||
              (substr($1, 4, 1) == "x" && substr($1, 10, 1) != "x")) { print }
          ')"
          if [ -n "${BAD}" ]; then
            echo "::error::AppImage contains files not usable by other users:"
            echo "${BAD}"
            exit 1
          fi
          echo "AppImage permissions OK"

      - name: Generate SHA256 checksums
        id: checksums
        run: |
          set -euo pipefail
          APPIMAGE="${{ steps.artifacts.outputs.appimage }}"
          DEB="${{ steps.artifacts.outputs.deb }}"
          CHECKSUM_FILE="sha256sums.txt"
          sha256sum "${APPIMAGE}" "${DEB}" > "${CHECKSUM_FILE}"
          cat "${CHECKSUM_FILE}"
          echo "checksum_file=${CHECKSUM_FILE}" >> "$GITHUB_OUTPUT"


      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: alpaka-desktop-${{ github.ref_name }}.spdx.json
          output-file: sbom.spdx.json
          path: src-tauri/target/release/bundle

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}

      # ------------------------------------------------------------------ #
      # 9. Create GitHub Release and upload assets                          #
      # ------------------------------------------------------------------ #
      - name: Extract Release Notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[${VERSION}\]/ {flag=1; next} /^## \[/ {if(flag) exit} flag" CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: "Alpaka Desktop ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.checksums.outputs.checksum_file }}
            sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ======================================================================== #
  # Publish PKGBUILD to the Arch User Repository                             #
  #                                                                           #
  # Requires secret: AUR_SSH_PRIVATE_KEY                                     #
  #   Generate: ssh-keygen -t ed25519 -f ~/.ssh/aur_key                      #
  #   Register public key at https://aur.archlinux.org/account/              #
  # ======================================================================== #
  publish-aur:
    name: Publish to AUR
    needs: [ci-gate, release-linux]
    runs-on: ubuntu-22.04

    steps:
      # secrets context is not available in job-level if:, so guard here instead
      - name: Check AUR_SSH_PRIVATE_KEY secret
        id: guard
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_KEY" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AUR_SSH_PRIVATE_KEY not configured — skipping AUR publish."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.guard.outputs.run == 'true'

      - name: Get version and AppImage sha256
        id: info
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          gh release download "${GITHUB_REF_NAME}" --pattern sha256sums.txt -D /tmp/
          SHA=$(grep AppImage /tmp/sha256sums.txt | awk '{print $1}')
          echo "appimage_sha=${SHA}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch PKGBUILD with new version and checksum
        if: steps.guard.outputs.run == 'true'
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          SHA="${{ steps.info.outputs.appimage_sha }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD
          sed -i "s/sha256sums=.*/sha256sums=('${SHA}')/" packaging/aur/PKGBUILD

      - name: Generate .SRCINFO via Arch Linux container
        if: steps.guard.outputs.run == 'true'
        # TODO: pin archlinux/archlinux:base-devel by digest for reproducible builds
        # e.g. archlinux/archlinux@sha256:<digest>  (run: docker pull archlinux/archlinux:base-devel && docker inspect --format='{{index .RepoDigests 0}}')
        run: |
          docker run --rm \
            -v "$(pwd)/packaging/aur:/pkg" \
            archlinux/archlinux:base-devel \
            bash -c "
              pacman -Sy --noconfirm --needed base-devel >/dev/null 2>&1
              useradd -m builder
              chown -R builder:builder /pkg
              su - builder -c 'cd /pkg && makepkg --printsrcinfo > /pkg/.SRCINFO'
            "

      - name: Push to AUR
        if: steps.guard.outputs.run == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Strip CR, then detect format:
          #   raw OpenSSH key → write directly
          #   base64-encoded  → decode first (store as: base64 -w0 < ~/.ssh/aur_key)
          CLEAN_KEY=$(printf '%s\n' "$AUR_SSH_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN_KEY" | grep -qE "^-+BEGIN"; then
            printf '%s\n' "$CLEAN_KEY" > ~/.ssh/aur_id
          else
            printf '%s' "$CLEAN_KEY" | base64 --decode --ignore-garbage > ~/.ssh/aur_id
          fi
          chmod 600 ~/.ssh/aur_id
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          GIT_SSH="ssh -i ~/.ssh/aur_id -o StrictHostKeyChecking=yes"

          GIT_SSH_COMMAND="$GIT_SSH" \
            git clone ssh://aur@aur.archlinux.org/alpaka-desktop-bin.git /tmp/aur-repo

          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/

          cd /tmp/aur-repo
          git config user.email "nikoteressi@gmail.com"
          git config user.name "nikoteressi"
          git add PKGBUILD .SRCINFO

          git diff --cached --quiet && echo "AUR already up to date." && exit 0

          git commit -m "Update to ${{ github.ref_name }}"
          GIT_SSH_COMMAND="$GIT_SSH" git push

  # ======================================================================== #
  # Publish APT repository to GitHub Pages (gh-pages branch)                #
  #                                                                           #
  # Requires secrets:                                                         #
  #   GPG_PRIVATE_KEY  — base64-encoded armored GPG private key              #
  #     gpg --export-secret-keys --armor <ID> | base64 -w0                   #
  #   GPG_KEY_ID       — GPG key fingerprint (long format)                   #
  #                                                                           #
  # Users install once:                                                       #
  #   curl -fsSL https://<pages>/apt/key.gpg \                               #
  #     | sudo gpg --dearmor -o /etc/apt/keyrings/alpaka-desktop.gpg         #
  #   echo "deb [arch=amd64 signed-by=...] <pages>/apt stable main" \        #
  #     | sudo tee /etc/apt/sources.list.d/alpaka-desktop.list               #
  #   sudo apt update && sudo apt install alpaka-desktop                     #
  # ======================================================================== #
  publish-apt-repo:
    name: Publish APT Repository
    needs: [ci-gate, release-linux]
    runs-on: ubuntu-22.04
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      # secrets context is not available in job-level if:, so guard here instead
      - name: Check GPG secrets
        id: guard
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          if [[ -n "$GPG_KEY" && -n "$GPG_ID" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GPG_PRIVATE_KEY / GPG_KEY_ID not configured — skipping APT publish."
          fi

      - name: Install APT repo tools
        if: steps.guard.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils

      - name: Import GPG signing key
        if: steps.guard.outputs.run == 'true'
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          # Strip CR (CRLF → LF), detect format, import
          CLEAN_KEY=$(printf '%s\n' "$GPG_KEY" | tr -d '\r')
          if printf '%s' "$CLEAN_KEY" | grep -qE "^-+BEGIN"; then
            printf '%s\n' "$CLEAN_KEY" | gpg --batch --import
          else
            # base64-encoded key; --ignore-garbage tolerates any stray whitespace
            printf '%s\n' "$CLEAN_KEY" | base64 --decode --ignore-garbage | gpg --batch --import
          fi
          # Derive the full 40-char fingerprint from the keyring (avoids GPG_ID format issues)
          # Use if/fi so a missing fingerprint doesn't propagate exit code 1
          FP=$(gpg --list-secret-keys --with-colons 2>/dev/null \
               | awk -F: '$1=="fpr"{print $10; exit}')
          if [[ -n "$FP" ]]; then
            printf '%s:6:\n' "$FP" | gpg --import-ownertrust
          fi

      - name: Download .deb from release
        if: steps.guard.outputs.run == 'true'
        # --repo required: no git checkout in this job, so gh can't auto-detect the repo
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.deb" -D /tmp/release/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout or create gh-pages branch
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch=gh-pages "$REMOTE" /tmp/gh-pages
          else
            mkdir /tmp/gh-pages
            cd /tmp/gh-pages
            git init
            git remote add origin "$REMOTE"
            git checkout --orphan gh-pages
            printf '# Alpaka Desktop Package Repositories\n' > README.md
            touch .nojekyll
            git add README.md .nojekyll
            git -c user.email="github-actions@github.com" \
                -c user.name="GitHub Actions" \
                commit -m "Initialize gh-pages"
          fi

      - name: Update APT repository
        if: steps.guard.outputs.run == 'true'
        env:
          GPG_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          DEB_FILE=$(find /tmp/release/ -name "*.deb" | head -n1)
          DEB_NAME=$(basename "$DEB_FILE")

          APT_ROOT=/tmp/gh-pages/apt
          POOL="${APT_ROOT}/pool/main/a/alpaka-desktop"
          DISTS="${APT_ROOT}/dists/stable/main/binary-amd64"

          mkdir -p "${POOL}" "${DISTS}"

          # Add .deb to pool — old versions are kept for pinning
          cp "$DEB_FILE" "${POOL}/${DEB_NAME}"

          # Regenerate Packages index from the full pool
          cd "${APT_ROOT}"
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -9kf dists/stable/main/binary-amd64/Packages

          # Build Release file
          RELEASE="${APT_ROOT}/dists/stable/Release"
          {
            echo "Origin: Alpaka Desktop"
            echo "Label: Alpaka Desktop"
            echo "Suite: stable"
            echo "Codename: stable"
            echo "Architectures: amd64"
            echo "Components: main"
            echo "Description: Alpaka Desktop APT repository"
            echo "Date: $(date -Ru)"
          } > "${RELEASE}"

          # Append checksum sections
          for HASH in MD5Sum SHA1 SHA256; do
            echo "${HASH}:" >> "${RELEASE}"
            for F in dists/stable/main/binary-amd64/Packages \
                     dists/stable/main/binary-amd64/Packages.gz; do
              SIZE=$(wc -c < "$F")
              case "$HASH" in
                MD5Sum) SUM=$(md5sum    "$F" | awk '{print $1}') ;;
                SHA1)   SUM=$(sha1sum   "$F" | awk '{print $1}') ;;
                SHA256) SUM=$(sha256sum "$F" | awk '{print $1}') ;;
              esac
              printf " %s %16s %s\n" "$SUM" "$SIZE" "${F#dists/stable/}" >> "${RELEASE}"
            done
          done

          # Derive fingerprint from keyring (GPG_ID format varies; fingerprint is stable)
          FP=$(gpg --list-secret-keys --with-colons 2>/dev/null \
               | awk -F: '$1=="fpr"{print $10; exit}')

          # Sign Release
          GPG_OPTS="--batch --yes --no-tty --pinentry-mode loopback"
          # shellcheck disable=SC2086
          gpg $GPG_OPTS --default-key "$FP" \
            --clearsign -o "${APT_ROOT}/dists/stable/InRelease" "${RELEASE}"
          # shellcheck disable=SC2086
          gpg $GPG_OPTS --default-key "$FP" \
            --detach-sign --armor -o "${APT_ROOT}/dists/stable/Release.gpg" "${RELEASE}"

          # Export public key for users to download (use fingerprint — export by ID silently fails)
          gpg --armor --export "$FP" > "${APT_ROOT}/key.gpg"

      - name: Commit and push to gh-pages
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/gh-pages
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add apt/
          git diff --cached --quiet && echo "No changes to APT repo." && exit 0
          git commit -m "apt: add ${{ github.ref_name }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push "$REMOTE" gh-pages
